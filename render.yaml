services:
  - type: web
    name: lunsjavtale-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lunsjavtale-db
          property: connectionString

databases:
  - name: lunsjavtale-db
    plan: free
